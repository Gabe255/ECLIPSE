name: Build ECLIPSE Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to replace its APK (for example v3.0.0)'
        required: false
        type: string
        default: ''
  push:
    branches: [main, 'redesign/**', 'release/**']
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Set build version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ECLIPSE_VERSION="${GITHUB_REF_NAME#v}"
          else
            ECLIPSE_VERSION="4.0.1"
          fi
          echo "ECLIPSE_VERSION=$ECLIPSE_VERSION" >> "$GITHUB_ENV"
      - name: Validate stable version
        run: |
          case "$ECLIPSE_VERSION" in *-alpha*|*-beta*|*-rc*) echo "Stable version cannot contain a prerelease suffix."; exit 1 ;; esac
      - name: Build web app
        env:
          VITE_ECLIPSE_VERSION: ${{ env.ECLIPSE_VERSION }}
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Install native folder scanner and ECLIPSE icon
        run: |
          mkdir -p android/app/src/main/java/com/eclipse/launcher android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi android/app/src/main/res/mipmap-anydpi-v26
          cp android-native/eclipse_icon_foreground.xml android/app/src/main/res/drawable/eclipse_icon_foreground.xml
          cp android-native/ic_launcher_legacy.xml android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          cp android-native/ic_launcher_adaptive.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp android-native/FolderAccessPlugin.java android/app/src/main/java/com/eclipse/launcher/FolderAccessPlugin.java
          cp android-native/UpdateDownloadPlugin.java android/app/src/main/java/com/eclipse/launcher/UpdateDownloadPlugin.java
          cp android-native/LauncherSetupPlugin.java android/app/src/main/java/com/eclipse/launcher/LauncherSetupPlugin.java
          cp android-native/DisplayInfoPlugin.java android/app/src/main/java/com/eclipse/launcher/DisplayInfoPlugin.java
          cp android-native/SystemControlsPlugin.java android/app/src/main/java/com/eclipse/launcher/SystemControlsPlugin.java
          python3 - <<'PY'
          from pathlib import Path
          activity = Path("android/app/src/main/java/com/eclipse/launcher/MainActivity.java")
          source = activity.read_text()
          source = source.replace(
              "import com.getcapacitor.BridgeActivity;",
              "import android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;"
          )
          source = source.replace(
              "public class MainActivity extends BridgeActivity {}",
              "public class MainActivity extends BridgeActivity {\n"
              "    @Override\n"
              "    public void onCreate(Bundle savedInstanceState) {\n"
              "        registerPlugin(FolderAccessPlugin.class);\n"
              "        registerPlugin(LauncherSetupPlugin.class);\n"
              "        registerPlugin(DisplayInfoPlugin.class);\n"
              "        registerPlugin(SystemControlsPlugin.class);\n"
              "        super.onCreate(savedInstanceState);\n"
              "    }\n"
              "}"
          )
          activity.write_text(source)
          gradle = Path("android/app/build.gradle")
          import os, re
          build = gradle.read_text()
          build = re.sub(r'versionCode\s+\d+', 'versionCode ' + os.environ["GITHUB_RUN_NUMBER"], build, count=1)
          build = re.sub(r'versionName\s+"[^"]+"', 'versionName "' + os.environ["ECLIPSE_VERSION"] + '"', build, count=1)
          dependencies = [
              '    implementation "androidx.documentfile:documentfile:1.0.1"',
              '    implementation "androidx.window:window-java:1.3.0"',
          ]
          for dependency in dependencies:
              if dependency not in build:
                  build = build.replace("dependencies {", "dependencies {\n" + dependency, 1)
          gradle.write_text(build)
          import xml.etree.ElementTree as ET
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(manifest)
          root = tree.getroot()
          app = root.find("application")
          if app is not None:
              app.set("{http://schemas.android.com/apk/res/android}icon", "@mipmap/ic_launcher")
              app.set("{http://schemas.android.com/apk/res/android}roundIcon", "@mipmap/ic_launcher")
          if root.find("queries") is None:
              queries = ET.Element("queries")
              intent = ET.SubElement(queries, "intent")
              action = ET.SubElement(intent, "action")
              action.set("{http://schemas.android.com/apk/res/android}name", "android.intent.action.MAIN")
              category = ET.SubElement(intent, "category")
              category.set("{http://schemas.android.com/apk/res/android}name", "android.intent.category.LAUNCHER")
              root.insert(0, queries)
          ns = "{http://schemas.android.com/apk/res/android}"
          for activity_node in root.iter("activity"):
              if activity_node.get(ns + "name", "").endswith("MainActivity"):
                  home_filter = ET.SubElement(activity_node, "intent-filter")
                  home_action = ET.SubElement(home_filter, "action")
                  home_action.set(ns + "name", "android.intent.action.MAIN")
                  for category_name in ("android.intent.category.HOME", "android.intent.category.DEFAULT"):
                      home_category = ET.SubElement(home_filter, "category")
                      home_category.set(ns + "name", category_name)
                  break
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          PY
      - name: Configure persistent release signing
        env:
          ECLIPSE_KEYSTORE_BASE64: ${{ secrets.ECLIPSE_KEYSTORE_BASE64 }}
          ECLIPSE_KEYSTORE_PASSWORD: ${{ secrets.ECLIPSE_KEYSTORE_PASSWORD }}
          ECLIPSE_KEY_ALIAS: ${{ secrets.ECLIPSE_KEY_ALIAS }}
          ECLIPSE_KEY_PASSWORD: ${{ secrets.ECLIPSE_KEY_PASSWORD }}
        run: |
          if [ -z "$ECLIPSE_KEYSTORE_BASE64" ] || [ -z "$ECLIPSE_KEYSTORE_PASSWORD" ] || [ -z "$ECLIPSE_KEY_ALIAS" ] || [ -z "$ECLIPSE_KEY_PASSWORD" ]; then
            echo "ECLIPSE_SIGNED=false" >> "$GITHUB_ENV"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "Stable releases require the persistent ECLIPSE signing key."; exit 1; fi
            echo "No persistent signing key configured; building a debug APK for testing only."
          else
            echo "$ECLIPSE_KEYSTORE_BASE64" | base64 --decode > android/app/eclipse-release.keystore
            python3 - <<'PY'
          from pathlib import Path
          build_file = Path("android/app/build.gradle")
          source = build_file.read_text()
          signing = '''
              signingConfigs {
                  eclipseRelease {
                      storeFile file("eclipse-release.keystore")
                      storePassword System.getenv("ECLIPSE_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ECLIPSE_KEY_ALIAS")
                      keyPassword System.getenv("ECLIPSE_KEY_PASSWORD")
                  }
              }
          '''
          source = source.replace("buildTypes {", signing + "\n    buildTypes {", 1)
          start = source.index("buildTypes {")
          release = source.index("release {", start)
          source = source[:release] + source[release:].replace("release {", "release {\n            signingConfig signingConfigs.eclipseRelease", 1)
          build_file.write_text(source)
          PY
            echo "ECLIPSE_SIGNED=true" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "$ECLIPSE_SIGNED" = "true" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk
          else
            ./gradlew assembleDebug
          fi
      - name: Name versioned APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/ECLIPSE-v${ECLIPSE_VERSION}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECLIPSE-v${{ env.ECLIPSE_VERSION }}-apk
          path: android/app/build/outputs/apk/debug/ECLIPSE-v${{ env.ECLIPSE_VERSION }}.apk
          if-no-files-found: error
      - name: Publish stable GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || (github.ref == 'refs/heads/main' && format('v{0}', env.ECLIPSE_VERSION)) || github.ref_name }}
          name: ECLIPSE — The Eclipse Experience (v${{ env.ECLIPSE_VERSION }})
          prerelease: false
          overwrite_files: true
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/ECLIPSE-v${{ env.ECLIPSE_VERSION }}.apk
          body: |
            # ECLIPSE 4.0.1 — The Eclipse Experience

            A major ECLIPSE update focused on making the launcher feel like a complete gaming home.

            **Highlights**
            - Eclipse mascot and first-run onboarding for storage and display setup
            - Installed Android app discovery, pinning, and launching
            - Treat as Game labels and manual playtime/session tracking
            - Game library organization and folder scanning foundation
            - Single/dual display layout support with Android fold-feature detection
            - Experience Studio themes, profiles, wallpaper, and backup/restore
            - Control Center shortcuts, app-window brightness, and battery status

            **Known limitations**
            - Playtime tracking is manual, not automatic foreground tracking
            - Third-party emulator game-file launching is not implemented end-to-end
            - Real-device validation is still required; foldable behavior depends on Android hardware reporting
            - Metadata scraping, cloud sync, achievements, and an online theme marketplace are not included

            **Biggest Update Roadmap:** https://github.com/Gabe255/ECLIPSE/blob/main/docs/BIGGEST-UPDATE-ROADMAP.md

            **Download APK:** [ECLIPSE-v${{ env.ECLIPSE_VERSION }}.apk](https://github.com/Gabe255/ECLIPSE/releases/download/${{ github.event.inputs.release_tag || (github.ref == 'refs/heads/main' && format('v{0}', env.ECLIPSE_VERSION)) || github.ref_name }}/ECLIPSE-v${{ env.ECLIPSE_VERSION }}.apk)
