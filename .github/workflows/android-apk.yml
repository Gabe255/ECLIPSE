name: Build ECLIPSE Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to replace its APK (for example v0.2.0-alpha)'
        required: false
        type: string
        default: ''
  push:
    branches: [main]
    tags: ['v*-beta*', 'v*-alpha*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Set build version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ECLIPSE_VERSION="${GITHUB_REF_NAME#v}"
          else
            ECLIPSE_VERSION="0.3.0-beta.${GITHUB_RUN_NUMBER}"
          fi
          echo "ECLIPSE_VERSION=$ECLIPSE_VERSION" >> "$GITHUB_ENV"
      - name: Build web app
        env:
          VITE_ECLIPSE_VERSION: ${{ env.ECLIPSE_VERSION }}
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Install native folder scanner
        run: |
          mkdir -p android/app/src/main/java/com/eclipse/launcher
          cp android-native/FolderAccessPlugin.java android/app/src/main/java/com/eclipse/launcher/FolderAccessPlugin.java
          python3 - <<'PY'
          from pathlib import Path
          activity = Path("android/app/src/main/java/com/eclipse/launcher/MainActivity.java")
          source = activity.read_text()
          source = source.replace(
              "import com.getcapacitor.BridgeActivity;",
              "import android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;"
          )
          source = source.replace(
              "public class MainActivity extends BridgeActivity {}",
              "public class MainActivity extends BridgeActivity {\n"
              "    @Override\n"
              "    public void onCreate(Bundle savedInstanceState) {\n"
              "        registerPlugin(FolderAccessPlugin.class);\n"
              "        super.onCreate(savedInstanceState);\n"
              "    }\n"
              "}"
          )
          activity.write_text(source)
          gradle = Path("android/app/build.gradle")
          import os, re
          build = gradle.read_text()
          build = re.sub(r'versionCode\\s+\\d+', 'versionCode ' + os.environ["GITHUB_RUN_NUMBER"], build, count=1)
          build = re.sub(r'versionName\\s+"[^"]+"', 'versionName "' + os.environ["ECLIPSE_VERSION"] + '"', build, count=1)
          dependency = '    implementation "androidx.documentfile:documentfile:1.0.1"'
          if dependency not in build:
              build = build.replace("dependencies {", "dependencies {\n" + dependency, 1)
          gradle.write_text(build)
          import xml.etree.ElementTree as ET
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(manifest)
          root = tree.getroot()
          if root.find("queries") is None:
              queries = ET.Element("queries")
              intent = ET.SubElement(queries, "intent")
              action = ET.SubElement(intent, "action")
              action.set("{http://schemas.android.com/apk/res/android}name", "android.intent.action.MAIN")
              category = ET.SubElement(intent, "category")
              category.set("{http://schemas.android.com/apk/res/android}name", "android.intent.category.LAUNCHER")
              root.insert(0, queries)
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          PY
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish beta GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || (github.ref == 'refs/heads/main' && format('v0.3.0-beta.{0}', github.run_number)) || github.ref_name }}
          name: ECLIPSE ${{ github.event.inputs.release_tag || (github.ref == 'refs/heads/main' && format('v0.3.0-beta.{0}', github.run_number)) || github.ref_name }}
          prerelease: true
          overwrite_files: true
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            **ECLIPSE Beta**

            Early Android dashboard build for testing on the AYN Odin 3.
            This is a debug APK and is not a finished emulator launcher.

            Please report bugs and compatibility issues before using this as a daily launcher.

            **Download APK:** [app-debug.apk](https://github.com/Gabe255/ECLIPSE/releases/download/${{ github.event.inputs.release_tag || (github.ref == 'refs/heads/main' && format('v0.3.0-beta.{0}', github.run_number)) || github.ref_name }}/app-debug.apk)
