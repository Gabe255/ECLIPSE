name: Build ECLIPSE Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*-beta*', 'v*-alpha*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish beta GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ECLIPSE ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            **ECLIPSE Beta**

            Early Android dashboard build for testing on the AYN Odin 3.
            This is a debug APK and is not a finished emulator launcher.

            Please report bugs and compatibility issues before using this as a daily launcher.

            **Download APK:** [app-debug.apk](https://github.com/Gabe255/ECLIPSE/releases/download/${{ github.ref_name }}/app-debug.apk)
