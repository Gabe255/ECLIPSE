name: Build ECLIPSE Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to replace its APK (for example v0.2.0-alpha)'
        required: false
        type: string
        default: 'v0.2.0-alpha'
  push:
    branches: [main]
    tags: ['v*-beta*', 'v*-alpha*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Install native folder scanner
        run: |
          mkdir -p android/app/src/main/java/com/eclipse/launcher
          cp android-native/FolderAccessPlugin.java android/app/src/main/java/com/eclipse/launcher/FolderAccessPlugin.java
          python3 - <<'PY'
          from pathlib import Path
          activity = Path("android/app/src/main/java/com/eclipse/launcher/MainActivity.java")
          source = activity.read_text()
          source = source.replace(
              "import com.getcapacitor.BridgeActivity;",
              "import android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;"
          )
          source = source.replace(
              "public class MainActivity extends BridgeActivity {}",
              "public class MainActivity extends BridgeActivity {\n"
              "    @Override\n"
              "    public void onCreate(Bundle savedInstanceState) {\n"
              "        registerPlugin(FolderAccessPlugin.class);\n"
              "        super.onCreate(savedInstanceState);\n"
              "    }\n"
              "}"
          )
          activity.write_text(source)
          gradle = Path("android/app/build.gradle")
          build = gradle.read_text()
          dependency = '    implementation "androidx.documentfile:documentfile:1.0.1"'
          if dependency not in build:
              build = build.replace("dependencies {", "dependencies {\n" + dependency, 1)
          gradle.write_text(build)
          PY
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish beta GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || (github.ref == 'refs/heads/main' && 'v0.2.0-alpha') || github.ref_name }}
          name: ECLIPSE ${{ github.event.inputs.release_tag || (github.ref == 'refs/heads/main' && 'v0.2.0-alpha') || github.ref_name }}
          prerelease: true
          overwrite_files: true
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            **ECLIPSE Beta**

            Early Android dashboard build for testing on the AYN Odin 3.
            This is a debug APK and is not a finished emulator launcher.

            Please report bugs and compatibility issues before using this as a daily launcher.

            **Download APK:** [app-debug.apk](https://github.com/Gabe255/ECLIPSE/releases/download/${{ github.event.inputs.release_tag || (github.ref == 'refs/heads/main' && 'v0.2.0-alpha') || github.ref_name }}/app-debug.apk)
